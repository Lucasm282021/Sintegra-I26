<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco M · Sintegra I26</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<div class="aviso">Simulación académica: cuentas, CBU, alias y saldos son ficticios.</div>

<!-- Ingreso -->
<main id="pantalla-login" class="login">
  <section class="login-card" aria-labelledby="titulo-login">
    <div class="marca"><span class="marca-logo" aria-hidden="true">M</span><div><strong>Banco M</strong><small>Ecosistema Sintegra I26</small></div></div>
    <h1 id="titulo-login">Ingresá a tu banco</h1>
    <form id="form-login" class="form">
      <label for="login-cuit">CUIT</label>
      <input id="login-cuit" inputmode="numeric" maxlength="11" autocomplete="username" required placeholder="11 dígitos, sin guiones">
      <label for="login-pass">Contraseña</label>
      <input id="login-pass" type="password" autocomplete="current-password" required>
      <button class="btn btn-primario" type="submit">Ingresar</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>
  <section class="demo-card" aria-labelledby="titulo-demo">
    <h2 id="titulo-demo">Usuarios de prueba (ayuda memoria)</h2>
    <p>Contraseña para todos: <code id="demo-pass">banco1234</code>. Tocá un usuario para completar el ingreso.</p>
    <div id="demo-lista" class="demo-lista"><p class="muted">Cargando…</p></div>
  </section>
</main>

<!-- Panel -->
<div id="pantalla-app" hidden>
  <header class="topbar">
    <div class="marca"><span class="marca-logo" aria-hidden="true">M</span><div><strong>Banco M</strong><small id="usuario-rol"></small></div></div>
    <div class="topbar-der">
      <span class="en-vivo" title="Los datos se actualizan solos cada 5 segundos"><span class="punto"></span>En vivo</span>
      <span id="usuario-nombre" class="usuario"></span>
      <button id="btn-salir" class="btn btn-claro" type="button">Salir</button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Secciones" id="menu"></nav>
    <main id="contenido" class="contenido" tabindex="-1"></main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
