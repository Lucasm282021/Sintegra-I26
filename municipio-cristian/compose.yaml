services:
  municipio:
    build: .
    image: municipio-cristian:local
    container_name: municipio-cristian
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_PATH: /data/municipio.db
    ports:
      - "3005:3005"
    volumes:
      - municipio-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3005/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  municipio-data:
